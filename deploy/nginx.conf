server {
    listen 80;
    server_name VPS_IP _;

    # Frontend React (archivos estáticos del build)
    root /var/www/crochetflix/frontend/dist;
    index index.html;

    # React Router — todas las rutas van al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend Node.js
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Imágenes de patrones subidas
    location /uploads {
        alias /var/www/crochetflix/backend/uploads;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
