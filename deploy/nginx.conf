server {
    listen 80;
    server_name crochetflix.app www.crochetflix.app;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Frontend React
    root /var/www/crochetflix/frontend/dist;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # Cache estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API Proxy
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Uploads protegidos
    location /uploads {
        alias /var/www/crochetflix/backend/uploads;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;

        location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
            valid_referers server_names crochetflix.app www.crochetflix.app;
            if ($invalid_referer) {
                return 403;
            }
        }
    }

    # Logs
    access_log /var/log/nginx/crochetflix-access.log;
    error_log /var/log/nginx/crochetflix-error.log;
}