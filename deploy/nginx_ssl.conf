# ============================================
# CrochetFlix — Nginx con SSL (Let's Encrypt)
# ============================================

# Redirección HTTP → HTTPS
server {
    listen 80;
    server_name crochetflix.app www.crochetflix.app;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás redirige a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS — Frontend + API
server {
    listen 443 ssl http2;
    server_name crochetflix.app www.crochetflix.app;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/crochetflix.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crochetflix.app/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend React (archivos estáticos del build)
    root /var/www/crochetflix/frontend/dist;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # Cache estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router — todas las rutas del frontend van al index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy al backend Node.js (API)
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Imágenes de patrones subidas (con protección básica)
    location /uploads {
        alias /var/www/crochetflix/backend/uploads;
        expires 7d;
        add_header Cache-Control "public";

        # Prevenir listado de directorios
        autoindex off;

        # Solo servir imágenes
        location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
            valid_referers server_names crochetflix.app www.crochetflix.app;
            if ($invalid_referer) {
                return 403;
            }
        }
    }

    # Logs
    access_log /var/log/nginx/crochetflix-access.log;
    error_log /var/log/nginx/crochetflix-error.log;
}
